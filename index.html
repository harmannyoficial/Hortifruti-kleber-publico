<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frutaria Dona Tônia</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* =========================================================
     CSS — Frutaria Dona Tônia
     Edite as variáveis abaixo para mudar cores rapidamente
  ========================================================= */
    :root {
      --verde: #2d6a4f;
      --verde-claro: #52b788;
      --laranja: #f4a261;
      --vermelho: #e63946;
      --fundo: #f8f5f0;
      --branco: #ffffff;
      --texto: #1a1a2e;
      --cinza: #888;
      --sombra: 0 4px 20px rgba(0, 0, 0, 0.10);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
    }

    /* ---- HEADER ---- */
    header {
      background: var(--verde);
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      font-size: 1.6rem;
    }

    /* Botão carrinho */
    .btn-carrinho {
      background: var(--laranja);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, background 0.2s;
    }

    .btn-carrinho:hover {
      transform: scale(1.05);
      background: #e07d3a;
    }

    #carrinho-count {
      background: var(--vermelho);
      border-radius: 50px;
      padding: 2px 8px;
      font-size: 0.8rem;
    }

    /* ---- BANNER ---- */
    .banner {
      background: linear-gradient(135deg, var(--verde) 0%, var(--verde-claro) 100%);
      color: white;
      padding: 36px 24px;
      text-align: center;
    }

    .banner h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .banner p {
      font-size: 1rem;
      opacity: 0.9;
    }

    /* ---- CATEGORIAS ---- */
    .categorias-wrap {
      padding: 20px 24px 8px;
      overflow-x: auto;
      display: flex;
      gap: 10px;
      scrollbar-width: none;
    }

    .categorias-wrap::-webkit-scrollbar {
      display: none;
    }

    .btn-cat {
      white-space: nowrap;
      border: 2px solid var(--verde);
      background: white;
      color: var(--verde);
      border-radius: 50px;
      padding: 8px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cat.ativo,
    .btn-cat:hover {
      background: var(--verde);
      color: white;
    }

    /* ---- PRODUTOS ---- */
    .produtos-titulo {
      padding: 16px 24px 4px;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      color: var(--cinza);
    }

    .grid-produtos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      padding: 12px 24px 100px;
    }

    /* Card produto */
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--sombra);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .card-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-nome {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .card-unidade {
      font-size: 0.78rem;
      color: var(--cinza);
    }

    /* Preço */
    .preco-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preco-original {
      text-decoration: line-through;
      color: var(--cinza);
      font-size: 0.82rem;
    }

    .preco-final {
      font-weight: 800;
      color: var(--verde);
      font-size: 1.05rem;
    }

    .badge-desc {
      background: var(--vermelho);
      color: white;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
    }

    /* Botão adicionar */
    .btn-add {
      margin-top: auto;
      background: var(--verde);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 9px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: var(--verde-claro);
    }

    /* ---- MODAL CARRINHO ---- */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.aberto {
      display: flex;
    }

    .modal-carrinho {
      background: white;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-topo h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
    }

    .btn-fechar {
      background: var(--fundo);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Item no carrinho */
    .item-carrinho {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .item-carrinho img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
    }

    .item-info {
      flex: 1;
    }

    .item-info strong {
      display: block;
      font-size: 0.9rem;
    }

    .item-info span {
      font-size: 0.82rem;
      color: var(--cinza);
    }

    .qtd-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qtd {
      background: var(--fundo);
      border: none;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qtd-num {
      font-weight: 700;
      min-width: 20px;
      text-align: center;
    }

    /* Entrega */
    .secao-entrega {
      margin-top: 18px;
      background: var(--fundo);
      border-radius: var(--radius);
      padding: 16px;
    }

    .secao-entrega h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .campo {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .campo label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--cinza);
    }

    .campo input,
    .campo select {
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
    }

    .campo input:focus,
    .campo select:focus {
      border-color: var(--verde);
    }

    /* Tipo entrega */
    .tipo-entrega {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-tipo {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      background: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-tipo.ativo {
      border-color: var(--verde);
      background: var(--verde);
      color: white;
    }

    /* Resumo e botão finalizar */
    .resumo {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .resumo-linha {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .resumo-linha.total {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--verde);
    }

    .btn-whatsapp {
      margin-top: 16px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .btn-whatsapp:hover {
      background: #1aad4e;
    }

    .btn-whatsapp svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .vazio {
      text-align: center;
      padding: 32px;
      color: var(--cinza);
      font-size: 1rem;
    }

    /* Responsivo */
    @media (max-width: 400px) {
      .grid-produtos {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px 14px 100px;
      }

      .banner h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

     SCRIPT — Lógica da loja

  <script src="dados.js"></script>
  <script>
    // ---- Estado ----
    let carrinho = [];
    let tipoEntregaAtual = 'retirada';
    let categoriaAtual = 'todos';

    // ---- Inicializar ----
    function init() {
      // Nome da loja
      document.title = NOME_LOJA;
      document.getElementById('banner-nome').innerHTML = '🍎 ' + NOME_LOJA;

      // Renderizar categorias
      const wrap = document.getElementById('categorias-wrap');
      CATEGORIAS.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'btn-cat';
        btn.textContent = cat.nome;
        btn.onclick = () => filtrar(cat.id, btn);
        wrap.appendChild(btn);
      });

      renderProdutos();
    }

    // ---- Filtrar por categoria ----
    function filtrar(id, btn) {
      categoriaAtual = id;
      document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
      const titulo = id === 'todos' ? 'Todos os produtos'
        : CATEGORIAS.find(c => c.id === id)?.nome + '';
      document.getElementById('produtos-titulo').textContent = titulo;
      renderProdutos();
    }

    // ---- Renderizar grid de produtos ----
    function renderProdutos() {
      const grid = document.getElementById('grid-produtos');
      grid.innerHTML = '';

      const lista = categoriaAtual === 'todos'
        ? PRODUTOS
        : PRODUTOS.filter(p => p.categoria === categoriaAtual);

      if (lista.length === 0) {
        grid.innerHTML = '<div class="vazio">Nenhum produto nesta categoria.</div>';
        return;
      }

      lista.forEach(prod => {
        const temDesc = prod.descontoAtivo && prod.desconto > 0;
        const precoFinal = temDesc ? prod.preco * (1 - prod.desconto / 100) : prod.preco;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
        <img src="${prod.foto}" alt="${prod.nome}" loading="lazy"
             onerror="this.src='https://via.placeholder.com/200x130?text=Sem+foto'">
        <div class="card-body">
          <div class="card-nome">${prod.nome}</div>
          <div class="card-unidade">por ${prod.unidade}</div>
          <div class="preco-wrap">
            ${temDesc ? `<span class="preco-original">R$ ${prod.preco.toFixed(2).replace('.', ',')}</span>
                         <span class="badge-desc">-${prod.desconto}%</span>` : ''}
            <span class="preco-final">R$ ${precoFinal.toFixed(2).replace('.', ',')}</span>
          </div>
          <button class="btn-add" onclick='adicionarAoCarrinho(${prod.id})'>+ Adicionar</button>
        </div>
      `;
        grid.appendChild(card);
      });
    }

    // ---- Carrinho ----
    function adicionarAoCarrinho(id) {
      const prod = PRODUTOS.find(p => p.id === id);
      const temDesc = prod.descontoAtivo && prod.desconto > 0;
      const precoFinal = temDesc ? prod.preco * (1 - prod.desconto / 100) : prod.preco;

      const existente = carrinho.find(c => c.id === id);
      if (existente) {
        existente.qtd++;
      } else {
        carrinho.push({ ...prod, precoFinal, qtd: 1 });
      }
      atualizarContador();
      abrirCarrinho();
    }

    function atualizarContador() {
      const total = carrinho.reduce((a, c) => a + c.qtd, 0);
      document.getElementById('carrinho-count').textContent = total;
    }

    function abrirCarrinho() {
      document.getElementById('overlay').classList.add('aberto');
      renderCarrinho();
    }

    function fecharCarrinho() {
      document.getElementById('overlay').classList.remove('aberto');
    }

    function fecharSeClicarFora(e) {
      if (e.target.id === 'overlay') fecharCarrinho();
    }

    function alterarQtd(id, delta) {
      const item = carrinho.find(c => c.id === id);
      if (!item) return;
      item.qtd += delta;
      if (item.qtd <= 0) carrinho = carrinho.filter(c => c.id !== id);
      atualizarContador();
      renderCarrinho();
    }

    function renderCarrinho() {
      const lista = document.getElementById('lista-carrinho');
      if (carrinho.length === 0) {
        lista.innerHTML = '<div class="vazio">🛒 Seu carrinho está vazio</div>';
        document.getElementById('resumo').style.display = 'none';
        return;
      }
      document.getElementById('resumo').style.display = 'flex';

      lista.innerHTML = carrinho.map(item => `
      <div class="item-carrinho">
        <img src="${item.foto}" alt="${item.nome}" onerror="this.src='https://via.placeholder.com/52?text=?'">
        <div class="item-info">
          <strong>${item.nome}</strong>
          <span>R$ ${item.precoFinal.toFixed(2).replace('.', ',')} / ${item.unidade}</span>
        </div>
        <div class="qtd-wrap">
          <button class="btn-qtd" onclick="alterarQtd(${item.id}, -1)">−</button>
          <span class="qtd-num">${item.qtd}</span>
          <button class="btn-qtd" onclick="alterarQtd(${item.id}, 1)">+</button>
        </div>
      </div>
    `).join('');

      calcularTotal();
    }

    function calcularTotal() {
      const sub = carrinho.reduce((a, c) => a + c.precoFinal * c.qtd, 0);
      const taxa = tipoEntregaAtual === 'entrega' ? TAXA_ENTREGA : 0;
      const tot = sub + taxa;

      document.getElementById('subtotal').textContent = 'R$ ' + sub.toFixed(2).replace('.', ',');
      document.getElementById('val-entrega').textContent =
        tipoEntregaAtual === 'entrega' ? 'R$ ' + taxa.toFixed(2).replace('.', ',') : 'Retirada';
      document.getElementById('total').textContent = 'R$ ' + tot.toFixed(2).replace('.', ',');
    }

    // ---- Tipo de entrega ----
    function tipoEntrega(tipo) {
      tipoEntregaAtual = tipo;
      document.getElementById('btn-retirada').classList.toggle('ativo', tipo === 'retirada');
      document.getElementById('btn-entrega').classList.toggle('ativo', tipo === 'entrega');

      const camposEntrega = document.getElementById('campos-entrega');
      if (tipo === 'entrega') {
        camposEntrega.innerHTML = `
        <div class="campo">
          <label>Endereço (rua, número)</label>
          <input type="text" id="cli-rua" placeholder="Ex: Rua das Flores, 123">
        </div>
        <div class="campo">
          <label>Bairro</label>
          <input type="text" id="cli-bairro" placeholder="Ex: Centro">
        </div>
        <div class="campo">
          <label>Complemento (opcional)</label>
          <input type="text" id="cli-comp" placeholder="Ex: Apto 12, bloco B">
        </div>
      `;
      } else {
        camposEntrega.innerHTML = '';
      }
      calcularTotal();
    }

    // ---- Enviar pelo WhatsApp ----
    function enviarWhatsapp() {
      if (carrinho.length === 0) { alert('Adicione produtos ao carrinho!'); return; }

      const nome = document.getElementById('cli-nome').value.trim();
      const tel = document.getElementById('cli-tel').value.trim();
      if (!nome || !tel) { alert('Preencha seu nome e telefone!'); return; }

      let enderecoInfo = '';
      if (tipoEntregaAtual === 'entrega') {
        const rua = document.getElementById('cli-rua')?.value.trim();
        const bairro = document.getElementById('cli-bairro')?.value.trim();
        const comp = document.getElementById('cli-comp')?.value.trim();
        if (!rua || !bairro) { alert('Preencha o endereço de entrega!'); return; }
        enderecoInfo = `\n📍 *Endereço:* ${rua}, ${bairro}${comp ? ' — ' + comp : ''}`;
      }

      const sub = carrinho.reduce((a, c) => a + c.precoFinal * c.qtd, 0);
      const taxa = tipoEntregaAtual === 'entrega' ? TAXA_ENTREGA : 0;
      const tot = sub + taxa;

      const itens = carrinho.map(c =>
        `• ${c.nome} x${c.qtd} (${c.unidade}) — R$ ${(c.precoFinal * c.qtd).toFixed(2).replace('.', ',')}`
      ).join('\n');

      const msg = `🍃 *Pedido — ${NOME_LOJA}*\n\n` +
        `👤 *Cliente:* ${nome}\n📞 *Tel:* ${tel}` +
        enderecoInfo + `\n\n` +
        `*Itens do pedido:*\n${itens}\n\n` +
        `Subtotal: R$ ${sub.toFixed(2).replace('.', ',')}\n` +
        (tipoEntregaAtual === 'entrega' ? `Entrega: R$ ${taxa.toFixed(2).replace('.', ',')}\n` : `Retirada na loja\n`) +
        `*Total: R$ ${tot.toFixed(2).replace('.', ',')}*`;

      const url = `https://wa.me/${WHATSAPP_LOJA}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    // ---- Start ----
    init();
  </script>
</body>

</html>
