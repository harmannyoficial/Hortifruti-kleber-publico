<!DOCTYPE html> 
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frutaria Dona Tônia</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --verde: #2d6a4f;
      --verde-claro: #52b788;
      --laranja: #f4a261;
      --vermelho: #e63946;
      --fundo: #f8f5f0;
      --branco: #ffffff;
      --texto: #1a1a2e;
      --cinza: #888;
      --sombra: 0 4px 20px rgba(0, 0, 0, 0.10);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--verde);
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      font-size: 1.6rem;
    }

    .btn-carrinho {
      background: var(--laranja);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, background 0.2s;
    }

    .btn-carrinho:hover {
      transform: scale(1.05);
      background: #e07d3a;
    }

    #carrinho-count {
      background: var(--vermelho);
      border-radius: 50px;
      padding: 2px 8px;
      font-size: 0.8rem;
    }

    /* BANNER */
    .banner {
      background: linear-gradient(135deg, var(--verde) 0%, var(--verde-claro) 100%);
      color: white;
      padding: 36px 24px;
      text-align: center;
    }

    .banner h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .banner p {
      font-size: 1rem;
      opacity: 0.9;
    }

    /* CATEGORIAS */
    .categorias-wrap {
      padding: 20px 24px 8px;
      overflow-x: auto;
      display: flex;
      gap: 10px;
      scrollbar-width: none;
    }

    .categorias-wrap::-webkit-scrollbar {
      display: none;
    }

    .btn-cat {
      white-space: nowrap;
      border: 2px solid var(--verde);
      background: white;
      color: var(--verde);
      border-radius: 50px;
      padding: 8px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cat.ativo,
    .btn-cat:hover {
      background: var(--verde);
      color: white;
    }

    /* TITULO */
    .produtos-titulo {
      padding: 16px 24px 4px;
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      color: var(--cinza);
    }

    /* GRID */
    .grid-produtos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      padding: 12px 24px 100px;
    }

    /* CARD */
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--sombra);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .card-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-nome {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .card-unidade {
      font-size: 0.78rem;
      color: var(--cinza);
    }

    .preco-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preco-original {
      text-decoration: line-through;
      color: var(--cinza);
      font-size: 0.82rem;
    }

    .preco-final {
      font-weight: 800;
      color: var(--verde);
      font-size: 1.05rem;
    }

    .badge-desc {
      background: var(--vermelho);
      color: white;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
    }

    /* QUANTIDADE */
    .quantidade-produto {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-qtd-prod {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 10px;
      background: var(--verde);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .qtd-produto {
      font-weight: 700;
      min-width: 22px;
      text-align: center;
    }

    .btn-add {
      margin-top: 10px;
      background: var(--verde);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-add:hover {
      background: var(--verde-claro);
    }

    /* OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay.aberto {
      display: flex;
    }

    /* MODAL */
    .modal-carrinho {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      animation: aparecer 0.25s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-topo h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
    }

    .btn-fechar {
      background: var(--fundo);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* ITEM CARRINHO */
    .item-carrinho {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item-carrinho img {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      object-fit: cover;
    }

    .item-info {
      flex: 1;
    }

    .item-info strong {
      display: block;
      font-size: 0.9rem;
    }

    .item-info span {
      font-size: 0.82rem;
      color: var(--cinza);
    }

    .qtd-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qtd {
      background: var(--fundo);
      border: none;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .qtd-num {
      font-weight: 700;
      min-width: 20px;
      text-align: center;
    }

    .btn-remover {
      background: var(--vermelho);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .btn-voltar {
      width: 100%;
      margin-top: 12px;
      background: var(--laranja);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-voltar:hover {
      opacity: 0.9;
    }

    /* ENTREGA */
    .secao-entrega {
      margin-top: 18px;
      background: var(--fundo);
      border-radius: var(--radius);
      padding: 16px;
    }

    .secao-entrega h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .campo {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .campo label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--cinza);
    }

    .campo input {
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .campo input:focus {
      border-color: var(--verde);
    }

    .tipo-entrega {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-tipo {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      background: white;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-tipo.ativo {
      border-color: var(--verde);
      background: var(--verde);
      color: white;
    }

    /* RESUMO */
    .resumo {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .resumo-linha {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .resumo-linha.total {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--verde);
    }

    .btn-whatsapp {
      margin-top: 16px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
    }

    .btn-whatsapp:hover {
      background: #1aad4e;
    }

    .vazio {
      text-align: center;
      padding: 30px;
      color: var(--cinza);
    }

    /* RESPONSIVO */
    @media (max-width: 600px) {

      header {
        padding: 14px;
      }

      .grid-produtos {
        grid-template-columns: repeat(2, 1fr);
        padding: 12px;
      }

      .modal-carrinho {
        padding: 18px;
        max-height: 95vh;
      }

      .item-carrinho {
        flex-wrap: wrap;
      }

      .qtd-wrap {
        width: 100%;
        justify-content: flex-end;
      }
    }

    @media (max-width: 420px) {
      .grid-produtos {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .banner h1 {
        font-size: 1.5rem;
      }

      .logo {
        font-size: 1.1rem;
      }

      .btn-carrinho {
        padding: 8px 12px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="logo">
      <span>🍃</span> Dona Tônia
    </div>

    <div style="display:flex; gap:10px; align-items:center;">

      <a href="admin.html" class="btn-carrinho" style="text-decoration:none;">
        ⚙️ Admin
      </a>

      <button class="btn-carrinho" onclick="abrirCarrinho()">
        🛒 Carrinho
        <span id="carrinho-count">0</span>
      </button>

    </div>

  </header>

  <!-- BANNER -->
  <div class="banner">
    <h1 id="banner-nome">🍎 Frutaria Dona Tônia</h1>
    <p>Frutas, verduras e legumes frescos — direto na sua porta!</p>
  </div>

  <!-- CATEGORIAS -->
  <div class="categorias-wrap" id="categorias-wrap">
    <button class="btn-cat ativo" onclick="filtrar('todos', this)">
      🛒 Todos
    </button>
  </div>

  <!-- TITULO -->
  <div class="produtos-titulo" id="produtos-titulo">
    Todos os produtos
  </div>

  <!-- GRID -->
  <div class="grid-produtos" id="grid-produtos"></div>

  <!-- MODAL -->
  <div class="overlay" id="overlay" onclick="fecharSeClicarFora(event)">

    <div class="modal-carrinho">

      <div class="modal-topo">
        <h2>🛒 Seu Carrinho</h2>
        <button class="btn-fechar" onclick="fecharCarrinho()">✕</button>
      </div>

      <div id="lista-carrinho"></div>

      <!-- VOLTAR -->
      <button class="btn-voltar" onclick="fecharCarrinho()">
        ← Voltar a Comprar
      </button>

      <!-- ENTREGA -->
      <div class="tipo-entrega">

        <button class="btn-tipo ativo" id="btn-retirada"
          onclick="tipoEntrega('retirada')">
          🏪 Retirada
        </button>

        <button class="btn-tipo" id="btn-entrega"
          onclick="tipoEntrega('entrega')">
          🚚 Entrega
        </button>

      </div>

      <!-- FORM -->
      <div class="secao-entrega">

        <h3>📋 Seus dados</h3>

        <div class="campo">
          <label>Nome</label>
          <input type="text" id="cli-nome">
        </div>

        <div class="campo">
          <label>Telefone</label>
          <input type="tel" id="cli-tel">
        </div>

        <div id="campos-entrega"></div>

      </div>

      <!-- RESUMO -->
      <div class="resumo" id="resumo">

        <div class="resumo-linha">
          <span>Subtotal</span>
          <span id="subtotal">R$ 0,00</span>
        </div>

        <div class="resumo-linha">
          <span>Entrega</span>
          <span id="val-entrega">Retirada</span>
        </div>

        <div class="resumo-linha total">
          <span>Total</span>
          <span id="total">R$ 0,00</span>
        </div>

      </div>

      <button class="btn-whatsapp" onclick="enviarWhatsapp()">
        Pedir pelo WhatsApp
      </button>

    </div>

  </div>

  <script src="dados.js"></script>

  <script>

    let carrinho = [];
    let categoriaAtual = 'todos';
    let tipoEntregaAtual = 'retirada';

    // INICIAR
    function init() {

      document.title = NOME_LOJA;

      document.getElementById('banner-nome').innerHTML =
        '🍎 ' + NOME_LOJA;

      const wrap = document.getElementById('categorias-wrap');

      CATEGORIAS.forEach(cat => {

        const btn = document.createElement('button');

        btn.className = 'btn-cat';
        btn.textContent = cat.nome;

        btn.onclick = () => filtrar(cat.id, btn);

        wrap.appendChild(btn);

      });

      renderProdutos();

    }

    // FILTRO
    function filtrar(id, btn) {

      categoriaAtual = id;

      document.querySelectorAll('.btn-cat')
        .forEach(b => b.classList.remove('ativo'));

      btn.classList.add('ativo');

      renderProdutos();

    }

    // RENDER PRODUTOS
    function renderProdutos() {

      const grid = document.getElementById('grid-produtos');

      grid.innerHTML = '';

      const lista = categoriaAtual === 'todos'
        ? PRODUTOS
        : PRODUTOS.filter(p => p.categoria === categoriaAtual);

      lista.forEach(prod => {

        const temDesc =
          prod.descontoAtivo && prod.desconto > 0;

        const precoFinal =
          temDesc
            ? prod.preco * (1 - prod.desconto / 100)
            : prod.preco;

        const card = document.createElement('div');

        card.className = 'card';

        card.innerHTML = `

          <img src="${prod.foto}" alt="${prod.nome}">

          <div class="card-body">

            <div class="card-nome">${prod.nome}</div>

            <div class="card-unidade">
              por ${prod.unidade}
            </div>

            <div class="preco-wrap">

              ${temDesc
                ? `
                <span class="preco-original">
                  R$ ${prod.preco.toFixed(2).replace('.', ',')}
                </span>

                <span class="badge-desc">
                  -${prod.desconto}%
                </span>
              `
                : ''
              }

              <span class="preco-final">
                R$ ${precoFinal.toFixed(2).replace('.', ',')}
              </span>

            </div>

            <!-- QUANTIDADE -->
            <div class="quantidade-produto">

              <button class="btn-qtd-prod"
                onclick="diminuirQtd(${prod.id})">
                -
              </button>

              <span class="qtd-produto"
                id="qtd-prod-${prod.id}">
                1
              </span>

              <button class="btn-qtd-prod"
                onclick="aumentarQtd(${prod.id})">
                +
              </button>

            </div>

            <button class="btn-add"
              onclick="adicionarAoCarrinho(${prod.id})">
              + Adicionar
            </button>

          </div>

        `;

        grid.appendChild(card);

      });

    }

    // QUANTIDADE PRODUTO
    function aumentarQtd(id) {

      const el = document.getElementById('qtd-prod-' + id);

      el.textContent = parseInt(el.textContent) + 1;

    }

    function diminuirQtd(id) {

      const el = document.getElementById('qtd-prod-' + id);

      let valor = parseInt(el.textContent);

      if (valor > 1) {
        el.textContent = valor - 1;
      }

    }

    // ADICIONAR CARRINHO
    function adicionarAoCarrinho(id) {

      const prod = PRODUTOS.find(p => p.id === id);

      const qtd =
        parseInt(document.getElementById('qtd-prod-' + id).textContent);

      const temDesc =
        prod.descontoAtivo && prod.desconto > 0;

      const precoFinal =
        temDesc
          ? prod.preco * (1 - prod.desconto / 100)
          : prod.preco;

      const existente =
        carrinho.find(c => c.id === id);

      if (existente) {

        existente.qtd += qtd;

      } else {

        carrinho.push({
          ...prod,
          qtd,
          precoFinal
        });

      }

      atualizarContador();

      abrirCarrinho();

    }

    // CONTADOR
    function atualizarContador() {

      const total =
        carrinho.reduce((a, c) => a + c.qtd, 0);

      document.getElementById('carrinho-count').textContent =
        total;

    }

    // MODAL
    function abrirCarrinho() {

      document.getElementById('overlay')
        .classList.add('aberto');

      renderCarrinho();

    }

    function fecharCarrinho() {

      document.getElementById('overlay')
        .classList.remove('aberto');

    }

    function fecharSeClicarFora(e) {

      if (e.target.id === 'overlay') {
        fecharCarrinho();
      }

    }

    // ALTERAR QTD
    function alterarQtd(id, delta) {

      const item = carrinho.find(c => c.id === id);

      if (!item) return;

      item.qtd += delta;

      if (item.qtd <= 0) {
        removerItem(id);
      }

      atualizarContador();

      renderCarrinho();

    }

    // REMOVER ITEM
    function removerItem(id) {

      carrinho =
        carrinho.filter(c => c.id !== id);

      atualizarContador();

      renderCarrinho();

    }

    // RENDER CARRINHO
    function renderCarrinho() {

      const lista =
        document.getElementById('lista-carrinho');

      if (carrinho.length === 0) {

        lista.innerHTML =
          '<div class="vazio">🛒 Seu carrinho está vazio</div>';

        return;

      }

      lista.innerHTML = carrinho.map(item => `

        <div class="item-carrinho">

          <img src="${item.foto}">

          <div class="item-info">

            <strong>${item.nome}</strong>

            <span>
              R$ ${item.precoFinal.toFixed(2).replace('.', ',')}
            </span>

          </div>

          <div class="qtd-wrap">

            <button class="btn-qtd"
              onclick="alterarQtd(${item.id}, -1)">
              −
            </button>

            <span class="qtd-num">
              ${item.qtd}
            </span>

            <button class="btn-qtd"
              onclick="alterarQtd(${item.id}, 1)">
              +
            </button>

            <button class="btn-remover"
              onclick="removerItem(${item.id})">
              Remover
            </button>

          </div>

        </div>

      `).join('');

      calcularTotal();

    }

    // TOTAL
    function calcularTotal() {

      const sub =
        carrinho.reduce((a, c) =>
          a + (c.precoFinal * c.qtd), 0);

      const taxa =
        tipoEntregaAtual === 'entrega'
          ? TAXA_ENTREGA
          : 0;

      const total = sub + taxa;

      document.getElementById('subtotal').textContent =
        'R$ ' + sub.toFixed(2).replace('.', ',');

      document.getElementById('val-entrega').textContent =
        tipoEntregaAtual === 'entrega'
          ? 'R$ ' + taxa.toFixed(2).replace('.', ',')
          : 'Retirada';

      document.getElementById('total').textContent =
        'R$ ' + total.toFixed(2).replace('.', ',');

    }

    // ENTREGA
    function tipoEntrega(tipo) {

      tipoEntregaAtual = tipo;

      document.getElementById('btn-retirada')
        .classList.toggle('ativo', tipo === 'retirada');

      document.getElementById('btn-entrega')
        .classList.toggle('ativo', tipo === 'entrega');

      calcularTotal();

    }

    // WHATSAPP
    function enviarWhatsapp() {

      if (carrinho.length === 0) {
        alert('Carrinho vazio!');
        return;
      }

      const nome =
        document.getElementById('cli-nome').value;

      const tel =
        document.getElementById('cli-tel').value;

      if (!nome || !tel) {
        alert('Preencha nome e telefone!');
        return;
      }

      const sub =
        carrinho.reduce((a, c) =>
          a + (c.precoFinal * c.qtd), 0);

      const taxa =
        tipoEntregaAtual === 'entrega'
          ? TAXA_ENTREGA
          : 0;

      const total = sub + taxa;

      const itens = carrinho.map(c =>

        `• ${c.nome} x${c.qtd} — R$ ${(c.precoFinal * c.qtd)
          .toFixed(2)
          .replace('.', ',')}`

      ).join('\n');

      const texto =

        `🍃 *Pedido — ${NOME_LOJA}*\n\n` +

        `👤 Cliente: ${nome}\n` +

        `📞 Telefone: ${tel}\n\n` +

        `🛒 *Itens:*\n${itens}\n\n` +

        `💰 Total: R$ ${total.toFixed(2).replace('.', ',')}`;

      const url =
        `https://wa.me/${WHATSAPP_LOJA}?text=${encodeURIComponent(texto)}`;

      window.open(url, '_blank');

    }

    init();

  </script>

</body>
